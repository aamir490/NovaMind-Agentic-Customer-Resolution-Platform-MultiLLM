name: novamind-local

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: novamind-backend:local
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=1770
    environment:
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    networks: [application]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: novamind-frontend:local
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=1770
    ports:
      - "127.0.0.1:${NOVAMIND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [application, edge]

networks:
  application:
    internal: true
  edge:
    driver: bridge
    internal: false
